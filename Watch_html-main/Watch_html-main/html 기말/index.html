<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Three.js Realistic 3D Wristwatch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>

<body>
  <header class="site-header">
    <div class="container">
      <div class="brand">AURUM</div>
      <nav class="nav">
        <a href="#">Collections</a>
        <a href="#">Craftsmanship</a>
        <a href="#">Boutiques</a>
        <button id="cart-btn" class="cart-btn" aria-label="Open cart">
          Cart <span id="cart-count" class="cart-count">0</span>
        </button>
      </nav>
    </div>
  </header>

  <main class="hero container">
    <section class="viewer-wrap">
      <div id="viewer" class="viewer"></div>
      <div class="gallery" id="product-gallery" aria-label="Product gallery"></div>
    </section>
    <aside class="product-panel">
      <div class="brand-label" id="product-brand">Brand</div>
      <h1 id="product-name">Product Name</h1>
      <p class="tagline" id="product-tagline">Tagline</p>
      <p class="price" id="product-price">Price</p>
      <p class="description" id="product-description">Description</p>
      <div class="actions">
        <div class="variant-controls" id="variant-controls"></div>
        <label class="qty-label">수량 <input id="qty" type="number" min="1" value="1" /></label>
        <button id="add-to-cart" class="btn btn-primary">Add to Cart</button>
        <button class="btn btn-outline">Find Boutique</button>
      </div>
    </aside>
  </main>

  <footer class="site-footer">
    <div class="container">© AURUM. All rights reserved.</div>
  </footer>

  <script src="script.js" defer></script>
</body>

</html>
