<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>3D Watch Configurator</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: sans-serif;
      }
      #ui-container {
        position: absolute;
        top: 20px;
        right: 20px;
        background: rgba(255, 255, 255, 0.85);
        padding: 20px;
        border-radius: 12px;
        width: 220px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      }
      .menu-section {
        margin-bottom: 20px;
      }
      button {
        cursor: pointer;
        padding: 8px 12px;
        margin: 3px;
        border: 1px solid #ddd;
        border-radius: 4px;
        background: white;
        transition: 0.2s;
      }
      button:hover {
        background: #f0f0f0;
      }
    </style>
  </head>
  <body>
    <header id="brand-header">
      <h1>PREMIUM WATCH STUDIO</h1>
      <p>EXPERIENCE THE ART OF PRECISION</p>
    </header>

    <div id="ui-container">
      <div class="menu-wrapper">
        <div id="case-menu" class="menu-section">
          <span class="section-title">CASE MATERIAL</span>
        </div>
        <div id="strap-menu" class="menu-section">
          <span class="section-title">STRAP SELECTION</span>
        </div>
      </div>
      <button id="order-btn">ADD TO CART</button>
    </div>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="main.js"></script>
  </body>
</html>
